/*
==================================================
60 MILLION TOKEN CHAT SYSTEM
==================================================
*/

const MAX_TOKENS = 60_000_000;

let messages = [];
let totalTokens = 0;


/*
Simple browser token estimator.

This is NOT tiktoken.
For exact model-specific tokenization, use a
real tokenizer such as tiktoken through Pyodide.
*/
function countTokens(text) {

  /*
  Rough approximation:
  about 4 characters per token.
  */
  return Math.ceil(text.length / 4);
}


/*
Add a message
*/
function addMessage(role, content) {

  const tokens = countTokens(content);

  messages.push({
    role: role,
    content: content,
    tokens: tokens
  });

  totalTokens += tokens;

  cleanupTokens();
  updateStats();
}


/*
Delete oldest messages when the limit is exceeded.
*/
function cleanupTokens() {

  while (
    totalTokens > MAX_TOKENS &&
    messages.length > 0
  ) {

    const oldMessage = messages.shift();

    totalTokens -= oldMessage.tokens;
  }
}


/*
==================================================
PRAYER GENERATOR
==================================================
*/

let lastPrayer = -1;


function generatePrayer() {

  let randomIndex;

  do {
    randomIndex =
      Math.floor(Math.random() * prayers.length);
  }
  while (
    prayers.length > 1 &&
    randomIndex === lastPrayer
  );

  lastPrayer = randomIndex;

  const selectedPrayer = prayers[randomIndex];

  document.getElementById("prayer").textContent =
    selectedPrayer;

  document.getElementById("prayerNumber").textContent =
    `Prayer ${randomIndex + 1}`;

  addMessage(
    "assistant",
    selectedPrayer
  );

  document.getElementById("status").textContent =
    "Prayer generated.";
}


/*
==================================================
COPY
==================================================
*/

async function copyPrayer() {

  const prayer =
    document.getElementById("prayer").textContent;

  if (
    !prayer ||
    prayer === "Click \"Generate Prayer\" to begin."
  ) {
    return;
  }

  try {

    await navigator.clipboard.writeText(prayer);

    document.getElementById("status").textContent =
      "Prayer copied!";

  } catch (error) {

    document.getElementById("status").textContent =
      "Could not copy the prayer.";
  }
}


/*
==================================================
STATS
==================================================
*/

function updateStats() {

  document.getElementById("tokenCount").textContent =
    totalTokens.toLocaleString();

  document.getElementById("messageCount").textContent =
    messages.length.toLocaleString();

  const percentage =
    Math.min(
      (totalTokens / MAX_TOKENS) * 100,
      100
    );

  document.getElementById("tokenBar").style.width =
    percentage + "%";
}


/*
Initialize
*/

updateStats();
